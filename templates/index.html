<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diabetic Retinopathy Detection</title>
<style>
  body { font-family: Arial, sans-serif; background:#f2f5f9; margin:0; padding:30px; color:#222; }
  .card { max-width:560px; margin:auto; background:#fff; padding:28px; border-radius:12px; box-shadow:0 2px 10px rgba(0,0,0,.1); }
  h1 { font-size:22px; margin-top:0; }
  button { background:#2563eb; color:#fff; border:none; padding:10px 20px; border-radius:6px; cursor:pointer; font-size:15px; }
  button:disabled { background:#94a3b8; }
  img { max-width:100%; margin-top:15px; border-radius:8px; }
  .bar { background:#e5e7eb; border-radius:4px; margin:4px 0 10px; }
  .fill { background:#2563eb; height:10px; border-radius:4px; }
  .result { margin-top:20px; }
  .note { font-size:12px; color:#666; margin-top:20px; }
</style>
</head>
<body>
<div class="card">
  <h1>AI-Based Diabetic Retinopathy Detection</h1>
  <input type="file" id="file" accept="image/png, image/jpeg">
  <button id="btn" onclick="send()">Predict</button>
  <img id="preview" style="display:none">
  <div class="result" id="result"></div>
  <p class="note">Educational project only. Not a medical diagnosis. Please consult an eye doctor.</p>
</div>
<script>
const fileInput = document.getElementById("file");
fileInput.onchange = function () {
  const f = fileInput.files[0];
  if (!f) return;
  const p = document.getElementById("preview");
  p.src = URL.createObjectURL(f);
  p.style.display = "block";
};
async function send() {
  const f = fileInput.files[0];
  const out = document.getElementById("result");
  if (!f) { out.innerText = "Please choose an image first."; return; }
  const btn = document.getElementById("btn");
  btn.disabled = true; out.innerText = "Analysing...";
  const fd = new FormData(); fd.append("image", f);
  try {
    const res = await fetch("/predict", { method: "POST", body: fd });
    const data = await res.json();
    if (data.error) { out.innerText = data.error; }
    else {
      let html = "<h3>Result: " + data.label + " (Grade " + data.grade + ") - " + data.confidence + "%</h3>";
      for (let i = 0; i < data.all.length; i++) {
        html += "<div>" + data.all[i].label + ": " + data.all[i].probability + "%</div>" +
                "<div class='bar'><div class='fill' style='width:" + data.all[i].probability + "%'></div></div>";
      }
      out.innerHTML = html;
    }
  } catch (e) { out.innerText = "Something went wrong."; }
  btn.disabled = false;
}
</script>
</body>
</html>
